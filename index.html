<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AQI-REVIVE | Lucknow Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }

      /* Dark Mode Scrollbar Overrides */
      .dark ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #334155; 
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }

      /* Leaflet Popups - Light Mode Default */
      .leaflet-popup-content-wrapper {
        background: #ffffff;
        color: #0f172a;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
      }
      .leaflet-popup-tip {
        background: #ffffff;
      }
      
      /* Leaflet Popups - Dark Mode Override */
      .dark .leaflet-popup-content-wrapper {
        background: #1e293b;
        color: #f1f5f9;
        border: 1px solid #475569;
      }
      .dark .leaflet-popup-tip {
        background: #1e293b;
      }
      
      /* Forecast Layer Animation */
      @keyframes dash-rotate {
        0% { stroke-dashoffset: 0; opacity: 0.4; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 24; opacity: 0.4; }
      }
      .forecast-ring {
        animation: dash-rotate 4s infinite linear;
        cursor: help !important;
        transform-origin: center;
      }

      @media print {
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        body {
          background: white;
          color: black;
        }
      }
    </style>
  <script type="importmap">
{

  }
}
</script>

</head>

</html>
